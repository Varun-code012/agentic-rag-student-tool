readme = "README.md"
authors = [
    { name = "Varun", email = "varunkumarm192@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=1.15.23",
    "crewai-tools>=1.15.23",
    "faiss-cpu>=1.15.1",
    "groq>=1.7.0",
    "langchain-community>=0.4.2",
    "pdfplumber>=0.11.10",
